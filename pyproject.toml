[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sino-lusophone-compliance-copilot"
version = "0.2.0"
description = "Auditable multilingual RAG and context engine for China-Lusophone trade compliance"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "qdrant-client>=1.12,<2",
  "langgraph>=0.3,<2",
  "streamlit>=1.39,<2",
  "pymupdf>=1.24,<2",
  "rank-bm25>=0.2.2,<1",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
trade-copilot-ingest = "scripts.ingest:main"
trade-copilot-eval = "scripts.evaluate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trade_copilot", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
